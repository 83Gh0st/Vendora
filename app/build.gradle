import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp' version '2.3.10'
}

// Supabase credentials live in local.properties (gitignored, per-machine)
// so they never end up committed to version control. See README.md for
// the two lines to add there:
//   SUPABASE_URL=https://your-project-ref.supabase.co
//   SUPABASE_ANON_KEY=your-anon-public-key
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

android {
    namespace 'com.vendora.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.vendora.app"
        // Supabase-kt requires API 26+ (below that needs core library desugaring)
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Supabase project credentials, injected as BuildConfig fields so the
        // real values never need to be hardcoded in source. Fill these in
        // local.properties (see README) — they are NOT secret keys, the anon
        // key is safe to ship in a client app as long as Row Level Security
        // is enabled on every table (see supabase/schema.sql).
        buildConfigField "String", "SUPABASE_URL", "\"${localProps.getProperty('SUPABASE_URL', '')}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${localProps.getProperty('SUPABASE_ANON_KEY', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Compose
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2026.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.ui:ui-util'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.animation:animation-graphics'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.compose.material:material-icons-extended'

    // Room Database (local, offline-first cache)
    def room_version = "2.7.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // CameraX
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // ML Kit Barcode Scanning
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // ZXing Core (needed for generating QR codes)
    implementation 'com.google.zxing:core:3.5.3'

    // --- Supabase (Auth + Postgrest cloud backend) ---
    implementation platform('io.github.jan-tennert.supabase:bom:3.6.0')
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation 'io.github.jan-tennert.supabase:storage-kt'
    // Ktor engine required by supabase-kt on Android
    implementation 'io.ktor:ktor-client-android:3.5.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Image loading for the shop-verification photo preview
    implementation 'io.coil-kt.coil3:coil-compose:3.5.0'
}
